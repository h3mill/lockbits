.cell{opacity:0;transform:scale(.3);transition:opacity .5s calc(var(--d)*var(--spd)),transform .7s calc(var(--d)*var(--spd)) var(--ease),background .3s}.go .cell{opacity:1;transform:none}.cell:hover{outline:2px solid var(--ink);outline-offset:1px}

</style></head><body><div class="app"><nav class="side" id="side"></nav><main id="v"></main></div>
<script>
const $=s=>document.querySelector(s),K='lockbits.demo.v2',pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const ago=n=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-n);return d};
const days=n=>Array.from({length:n},(_,i)=>ago(n-1-i));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=['#7aa2ff','#5eead4','#f5a65b','#f27c9a','#b39bff','#9bd36a','#facc15','#fb7185'];
const FONTS={System:'-apple-system,"Segoe UI",Roboto,sans-serif',Serif:'Georgia,"Times New Roman",serif',Mono:'ui-monospace,Menlo,Consolas,monospace',Rounded:'ui-rounded,"SF Pro Rounded",Nunito,system-ui,sans-serif',Classic:'Palatino,"Palatino Linotype",Georgia,serif'};
const DEF={name:'Hemil',cbg:'#1b1236',cpanel:'#271a4a',cink:'#f4ecff',cauto:true,prev:'dark',cdate:'',theme:'dark',accent:'#7aa2ff',font:'System',fs:100,radius:16,density:'comfy',side:'left',mini:false,speed:1,shape:'round',cs:11,weeks:26,ws:1,range:30,taskColor:'#9bd36a'};
const WD=['Sundays','Mondays','Tuesdays','Wednesdays','Thursdays','Fridays','Saturdays'];
const IC={Today:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',Notes:'<path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7"/>',Insights:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',Settings:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'};
let S,tab='Today',hf='all',R=30,note='',iv='habits',det='',mo=0;
function seed(){return{habits:[],tasks:[],cats:{Work:CC[0],Study:CC[1],Home:CC[2]},ct:{},notes:[],set:{...DEF}}}
function load(){try{const j=JSON.parse(localStorage.getItem(K));if(j&&Array.isArray(j.habits)){S=j;j.set={...DEF,...j.set};if(!j.set.cmp){j.set.cmp=1;j.set.cs=Math.min(j.set.cs,11)}j.ct=j.ct||{};fixCats();return j}}catch(e){}
 try{const o=JSON.parse(localStorage.getItem('lockbits.v1'));if(o&&Array.isArray(o.habits)){const m=seed();m.habits=o.habits.map(h=>({id:h.id,name:h.name,color:h.color||P[0],d:Object.fromEntries((h.days||[]).map(x=>[x,1]))}));m.tasks=(o.tasks||[]).map(t=>({id:t.id,text:t.text,cat:'Work',done:t.done||null}));m.notes=o.notes||[];S=m;fixCats();return m}}catch(e){}
 return seed()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const lum=h=>{const n=parseInt(h.slice(1),16);return(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255};
function checkCustom(){const s=S.set;if(s.theme==='custom'&&s.cauto&&s.cdate!==key(new Date())){s.theme=s.prev||'dark';return true}return false}
function midnight(){const n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1,0,0,1);setTimeout(()=>{apply();save();renderSide();render(false);midnight()},t-n)}
function apply(){checkCustom();const r=document.documentElement,s=S.set,st=r.style;
 ['--bg','--panel','--p2','--ink','--mute','--line','--cell0'].forEach(v=>st.removeProperty(v));
 if(s.theme==='custom'){const m=(a,p,b)=>`color-mix(in srgb,${a} ${p}%,${b})`;st.setProperty('--bg',s.cbg);st.setProperty('--panel',s.cpanel);st.setProperty('--ink',s.cink);st.setProperty('--p2',m(s.cink,8,s.cpanel));st.setProperty('--mute',m(s.cink,60,s.cpanel));st.setProperty('--line',m(s.cink,14,s.cpanel));st.setProperty('--cell0',m(s.cink,10,s.cbg));r.dataset.theme=lum(s.cbg)<.5?'dark':'light'}
 else s.theme==='system'?r.removeAttribute('data-theme'):r.dataset.theme=s.theme;
 st.setProperty('--acc',s.accent);st.setProperty('--r',s.radius+'px');st.setProperty('--fs',s.fs/100);st.setProperty('--font',FONTS[s.font]);st.setProperty('--spd',s.speed);st.setProperty('--cs',s.cs+'px');st.setProperty('--pad',{compact:.65,comfy:1,spacious:1.4}[s.density]+'rem');
 const b=document.body.classList;b.toggle('sb-right',s.side==='right');b.toggle('sb-mini',!!s.mini);b.toggle('noanim',s.speed===0);b.toggle('sh-sq',s.shape==='square');b.toggle('sh-ci',s.shape==='circle')}
const sH=()=>S.habits.map(h=>({id:h.id,name:h.name,color:h.color,k:'h',val:d=>h.d[key(d)]?1:0}));
const sT=()=>{const m={};S.tasks.forEach(t=>{if(t.done){const o=m[t.cat]=m[t.cat]||{};o[t.done]=(o[t.done]||0)+1}});return Object.keys(S.cats).map(n=>({id:'c:'+n,name:n,color:S.cats[n],k:'t',val:d=>(m[n]||{})[key(d)]||0}))};
const series=()=>iv==='tasks'?sT():sH();
const CC=['#facc15','#fb7185','#9bd36a','#5eead4','#b39bff','#f5a65b'];
function fixCats(){S.cats=S.cats||{};S.tasks.forEach(t=>{if(!S.cats[t.cat])S.cats[t.cat]=CC[Object.keys(S.cats).length%CC.length]})}
const streak=se=>{let n=0,i=se.val(ago(0))?0:1;while(i<400&&se.val(ago(i))){n++;i++}return n};
const sum=a=>a.reduce((x,y)=>x+y,0);
function buckets(se,n){const v=days(n).map(se.val),sz=n<=7?1:7,o=[];for(let e=v.length;e>0;e-=sz)o.unshift(sum(v.slice(Math.max(0,e-sz),e)));return o}
/* ---------- charts ---------- */
function cBar(b,c){const m=Math.max(1,...b),w=200/b.length;return`<svg viewBox="0 0 220 110">${b.map((v,i)=>{const h=Math.max(v/m*80,2);return`<rect class="bx" x="${10+i*w+w*.15}" y="${95-h}" width="${w*.7}" height="${h}" rx="${Math.min(5,w*.3)}" fill="${c}" style="transition-delay:${i*45}ms"><title>${v}</title></rect>`}).join('')}<line x1="8" x2="212" y1="96" y2="96" stroke="var(--line)"/></svg>`}
function cLine(b,c,id){const m=Math.max(1,...b),p=b.map((v,i)=>[10+i*200/Math.max(1,b.length-1),95-v/m*80]),L=p.map(q=>q.join(',')).join(' ');
 return`<svg viewBox="0 0 220 110"><defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".35"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs><polygon class="fd" points="10,95 ${L} 210,95" fill="url(#g${id})"/><polyline class="ln" pathLength="1" points="${L}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${p.map((q,i)=>`<circle class="fd" cx="${q[0]}" cy="${q[1]}" r="3" fill="${c}" style="transition-delay:${.5+i*.06}s"/>`).join('')}</svg>`}
function donut(parts,txt,sub){const tot=sum(parts.map(p=>p.v))||1,C=226.2;let s=0;
